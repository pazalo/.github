  <text x="44" y="84" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#F7F3EE" text-anchor="start" opacity="0.9">Two containers, one database, provisioned once</text>

