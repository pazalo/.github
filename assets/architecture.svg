  <rect x="44" y="652" width="1072" height="1" fill="#3A2E22"/>
  <text x="44" y="682" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="500" letter-spacing="0" fill="#B9A794" text-anchor="start" opacity="0.9">A Panel is its site — no site picker, and no third container.</text>
