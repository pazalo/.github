  <rect x="602" y="272" width="514" height="178" rx="16" fill="#1E1711" stroke="#5A4227" stroke-width="1.5"/><rect x="602" y="272" width="4" height="178" rx="2" fill="#FFC24D" fill-opacity="0.9"/><text x="630" y="318" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#F7F3EE" text-anchor="start">Panel</text><text x="630" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="15.5" font-weight="500" letter-spacing="0" fill="#B9A794" text-anchor="start">The back office, and the engine inside it</text><rect x="630" y="356" width="458" height="1" fill="#3A2E22"/><text x="630" y="397" font-family="'JetBrains Mono', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="0" fill="#B9A794" text-anchor="start">Next.js 16 · commerce</text><text x="630" y="420" font-family="'JetBrains Mono', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="0" fill="#B9A794" text-anchor="start">GraphQL — read and write</text>

